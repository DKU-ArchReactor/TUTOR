[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archreactor-tutor"
version = "0.2.0"
description = "Evidence-based explanations for ArchReactor RV32IM execution"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "pyelftools>=0.32,<1"]

[tool.setuptools.packages.find]
where = ["src"]
